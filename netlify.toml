[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "SMTP_HOST"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Cache-Control for immutable hashed assets ──
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers (all pages) ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-DNS-Prefetch-Control = "on"

# ── API Redirects for Netlify Serverless Functions ──
[[redirects]]
  from = "/api/create-order"
  to = "/.netlify/functions/create-order"
  status = 200

[[redirects]]
  from = "/api/create-order/"
  to = "/.netlify/functions/create-order"
  status = 200

[[redirects]]
  from = "/api/verify-payment"
  to = "/.netlify/functions/verify-payment"
  status = 200

[[redirects]]
  from = "/api/verify-payment/"
  to = "/.netlify/functions/verify-payment"
  status = 200

[[redirects]]
  from = "/api/calendly/create-link"
  to = "/.netlify/functions/calendly-create-link"
  status = 200

[[redirects]]
  from = "/api/calendly/create-link/"
  to = "/.netlify/functions/calendly-create-link"
  status = 200

[[redirects]]
  from = "/api/send-confirmation"
  to = "/.netlify/functions/send-confirmation"
  status = 200

[[redirects]]
  from = "/api/send-confirmation/"
  to = "/.netlify/functions/send-confirmation"
  status = 200
