<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="peachGrad" x1="280" y1="120" x2="520" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f16a24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff8c42" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="320" y1="160" x2="480" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Minimalist Grid Lattice -->
  <g opacity="0.4" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 6">
    <line x1="160" y1="40" x2="160" y2="410"/>
    <line x1="320" y1="40" x2="320" y2="410"/>
    <line x1="480" y1="40" x2="480" y2="410"/>
    <line x1="640" y1="40" x2="640" y2="410"/>
    <line x1="60" y1="150" x2="740" y2="150"/>
    <line x1="60" y1="300" x2="740" y2="300"/>
  </g>

  <!-- Outer Concentric Orbit -->
  <circle cx="400" cy="225" r="170" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="400" cy="225" r="120" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Confinement Geometric Planes (Clean Room motif) -->
  <rect x="250" y="115" width="300" height="220" rx="20" fill="url(#slateGrad)" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="290" y="145" width="220" height="160" rx="14" fill="#ffffff" fill-opacity="0.8" stroke="#f16a24" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Central Focal Geometry -->
  <circle cx="400" cy="225" r="48" fill="url(#peachGrad)"/>
  <circle cx="400" cy="225" r="18" fill="#ffffff" stroke="#f16a24" stroke-width="2.5"/>

  <!-- Minimalist Satellite Nodes & Cardinal Ticks -->
  <circle cx="250" cy="225" r="4" fill="#f16a24"/>
  <circle cx="550" cy="225" r="4" fill="#f16a24"/>
  <circle cx="400" cy="115" r="4" fill="#334155"/>
  <circle cx="400" cy="335" r="4" fill="#334155"/>

  <!-- Subtle Horizon Indicator -->
  <line x1="340" y1="375" x2="460" y2="375" stroke="#f16a24" stroke-width="2" stroke-linecap="round"/>
</svg>
